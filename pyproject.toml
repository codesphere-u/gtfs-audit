[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gtfs-audit"
version = "0.1.0"
description = "Zero-dependency GTFS & informal paratransit (matatu/trotro/bus) feed validator: Haversine inter-stop speed anomaly detector, headway regularity & bunching index, and service-span coverage auditor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "gtfs",
    "transit",
    "paratransit",
    "mobility",
    "transportation",
    "urban-planning",
    "headway",
    "geospatial",
    "africa",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
gtfs-audit = "gtfs_audit.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/gtfs-audit"
Repository = "https://github.com/codesphere-u/gtfs-audit"
Issues = "https://github.com/codesphere-u/gtfs-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["gtfs_audit"]
